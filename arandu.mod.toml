# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the application
# and never opens an installed package, so tests/Unit/audit_test.go is what
# compares these four lines with what the code calls.

name = "hyz-is/br"
# This package imports no framework package; it requires Hesape v0.88.0, which
# is where validation.Provider and Factory.Use are. No Framework release is
# built on that Hesape yet, so the floor stays at 0.66, the last one; it names
# its minor. An application on any Framework would have its Hesape raised past
# the one it was built with by installing this, and one that does not route its
# validation through a Factory that used br.Rules() gets no rule from it.
framework = ">= 0.66"
profiles = ["conventional", "performance"]

[permissions]
# It turns strings into strings. Nothing leaves the process.
network = false
# It reads no file and writes none; every value arrives as an argument.
filesystem = false
# It runs no other program.
exec = false
# It owns no table: a document number is stored by the application that took it.
migrations = false
